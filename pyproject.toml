[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speech-to-console"
version = "0.2.2"
description = "Convert spoken commands to console operations"
requires-python = "==3.10.*"
authors = [
    { name = "Nikita Shupeyko", email = "webyneter@gmail.com" },
]
dependencies = [
    "typer",
    "python-dotenv",
    "httpx",
    "pydantic",
    "rich",
    "pyautogui",
    "sounddevice",
    "soundfile",
    "numpy",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "tomli",
    "tomli-w",
]

[project.scripts]
speech-to-console = "speech_to_console.cli:app"
release = "scripts.release:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
