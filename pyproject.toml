[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "speech-to-console"
version = "0.3.3"
description = "Convert spoken commands to console operations"
requires-python = "==3.10.*"
authors = [
    { name = "Nikita Shupeyko", email = "webyneter@gmail.com" },
]
dependencies = [
    "typer",
    "python-dotenv",
    "httpx",
    "pydantic",
    "rich",
    "pyautogui",
    "sounddevice",
    "soundfile",
    "numpy",
    "structlog",
]

[project.scripts]
speech-to-console = "speech_to_console.cli:app"
release = "scripts.release:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "tomli",
    "tomli-w",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = [
    "speech_to_console",
    "scripts",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "W",
]
fixable = [
    "ALL",
]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
