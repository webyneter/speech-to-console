[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speech-to-console"
version = "0.1.0"
description = "Convert spoken commands to console operations"
requires-python = "==3.10.*"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "typer",
    "python-dotenv",
    "httpx",
    "pydantic",
    "rich",
    "pyautogui",
    "sounddevice",
    "soundfile",
    "numpy",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
speech-to-console = "speech_to_console.cli:app"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
