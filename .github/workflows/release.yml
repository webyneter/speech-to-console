name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          chmod +x ./install_dependencies.sh
          ./install_dependencies.sh

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: uv build

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Get today's date
        id: date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create default changelog
        id: default_changelog
        run: |
          echo "DEFAULT_CONTENT=## [$VERSION] - $TODAY\n\n### Added\n- New release version $VERSION" >> $GITHUB_ENV

      - name: Extract changelog
        id: changelog
        run: |
          # Try to extract existing changelog content
          CONTENT=$(grep -A 50 "## \[Unreleased\]" CHANGELOG.md | grep -B 50 "## \[" | head -n -1 || echo "")

          # If no content, use default
          if [ -z "$CONTENT" ]; then
            echo "CHANGELOG_CONTENT=$DEFAULT_CONTENT" >> $GITHUB_OUTPUT
          else
            # Replace Unreleased with version
            CONTENT="## [$VERSION] - $TODAY\n\n${CONTENT#*## \[Unreleased\]}"
            echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
