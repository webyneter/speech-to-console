name: Release

on:
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run this job when the workflow was triggered by a tag push and the build was successful
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          chmod +x ./install_dependencies.sh
          ./install_dependencies.sh

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: uv build

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Get today's date
        id: date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create default changelog
        id: default_changelog
        run: |
          echo "DEFAULT_CONTENT=## [$VERSION] - $TODAY\n\n### Added\n- New release version $VERSION" >> $GITHUB_ENV

      - name: Extract changelog
        id: changelog
        run: |
          # Get current version section only
          VERSION_PATTERN="## \\[$VERSION\\]"
          NEXT_VERSION_PATTERN="## \\["

          # Find the line number where current version starts
          START_LINE=$(grep -n "$VERSION_PATTERN" CHANGELOG.md | cut -d: -f1)

          if [ -z "$START_LINE" ]; then
            # If version not found, use default content
            echo "CHANGELOG_CONTENT=$DEFAULT_CONTENT" >> $GITHUB_OUTPUT
          else
            # Find the next version section (or EOF if this is the latest version)
            END_LINE=$(tail -n +$((START_LINE+1)) CHANGELOG.md | grep -n "$NEXT_VERSION_PATTERN" | head -1 | cut -d: -f1)

            if [ -z "$END_LINE" ]; then
              # No next version found, read until end of file
              CONTENT=$(tail -n +$START_LINE CHANGELOG.md)
            else
              # Get only the current version's content
              CONTENT=$(tail -n +$START_LINE CHANGELOG.md | head -n $((END_LINE-1)))
            fi

            echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
